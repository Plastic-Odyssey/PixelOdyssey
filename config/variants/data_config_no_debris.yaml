# PixelOdyssey - Configuration EXPÉRIMENTALE : Debris_Divers exclu de l'étude.
#
# Copie de config/data_config.yaml, PAS un remplacement - jamais utilisée par défaut par
# train.py / data_pipeline.py (voir leur option --config). Créée le 28/08/2026 : priorité
# affichée = bien annoter les déchets de TAILLE IMPORTANTE, rater les petits fragments
# hétérogènes (l'essentiel du contenu de Debris_Divers) n'est pas un problème pour cet usage.
# Voir le journal pour la discussion complète (dont l'avertissement sur la lecture des
# métriques - une précision macro plus haute ici n'est pas directement comparable à celle
# du dataset à 7 classes, voir plus bas).
#
# Chemin de SORTIE dédié (4_sliced_dataset_no_debris) : ne partage aucun fichier généré avec
# le dataset principal (4_sliced_dataset). Le dataset brut source (1_annotated_dataset) reste
# le même - seule la façon de le traduire en classes cibles change.
path: E:\PixelOdyssey\3. Processed dataset\4_sliced_dataset_no_debris
train: images/train
val: images/val
test : images/test

# ============================================================================
# TAXONOMIE CIBLE - 6 classes, Debris_Divers RETIRÉ (pas juste vidé - absent de `names`).
# Les IDs 0-5 des 6 autres classes sont inchangés par rapport à data_config.yaml : aucune
# renumérotation nécessaire, Debris_Divers était déjà le dernier ID (6).
# ============================================================================
names:
  0: Bouteille
  1: Flipflops
  2: Cagette
  3: Bouee
  4: Cordage_Filet
  5: Bidon

# ============================================================================
# RÉFÉRENTIEL DE CLASSES - voir data_config.yaml pour la doc complète du mécanisme
# (class_taxonomy / class_aliases / normalisation / onboarding). Ici, TOUT ce qui pointait
# vers Debris_Divers (6) dans le fichier principal pointe désormais vers "exclude" - ces
# instances ne sont ni annotées ni évaluées pour ce dataset expérimental, exactement comme
# "Morceaux de bois"/"Verre" déjà exclus dans le fichier principal.
# ============================================================================

class_taxonomy:
  # -> 0: Bouteille
  "bouteille PET": 0
  "Bouteille Plastique rigide": 0

  # -> 1: Flipflops
  "fliflops": 1             # voir class_aliases pour "flipflops" (lot SB)

  # -> 2: Cagette
  "cagette": 2

  # -> 3: Bouee
  "Bouées": 3
  "Bouées pieuvre": 3       # classe fantôme (jamais observée), placée par précaution
  "flotteurs": 3

  # -> 4: Cordage_Filet
  "Cordage": 4

  # -> 5: Bidon
  "Petit bidon": 5

  # -> exclue : tout ce qui allait vers Debris_Divers (6) dans le fichier principal, PLUS
  # les exclusions déjà présentes là-bas (matière non-plastique, classes pas encore
  # assumées). Voir data_config.yaml pour le détail de chaque cas.
  "Plastique souple (sac)": exclude
  "Mousse expansée": exclude
  "Polystyrene": exclude
  "Fragments plastique rigide": exclude
  "Tissu": exclude
  "Sceau": exclude
  "casques": exclude          # classe fantôme (jamais observée), placée par précaution
  "bouchons": exclude
  "Debris_Divers": exclude    # ce nom peut apparaître via le mapping "vers soi-même" d'un
                               # lot cold-start (voir data_config.yaml) - explicitement exclu
                               # ici plutôt qu'omis, pour ne jamais faire échouer
                               # raw_dataset_checker.py sur un nom réellement rencontré.
  "Morceaux de bois": exclude
  "Verre": exclude
  "à déterminer": exclude
  "Inconnu": exclude

  # Auto-mapping des 6 super-classes restantes vers elles-mêmes (lots cold-start, voir
  # data_config.yaml) - Debris_Divers volontairement ABSENT ici, déjà exclu ci-dessus.
  "Bouteille": 0
  "Flipflops": 1
  "Cagette": 2
  "Bouee": 3
  "Cordage_Filet": 4
  "Bidon": 5

class_aliases:
  "flipflops": "fliflops"
  "bouteilles_pet": "bouteille PET"
  "bouteilles_plastique_rigide": "Bouteille Plastique rigide"
