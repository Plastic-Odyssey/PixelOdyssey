# PixelOdyssey - Configuration du Dataset pour YOLOv11-seg

# Chemins d'accès racine et dossiers de split
# 4_sliced_dataset = sortie de l'étape 4 (src/data/slice_dataset.py), les imagettes 640x640
# prêtes pour YOLO. Généré en lançant tout le pipeline en une fois avec
# `python src/data/data_pipeline.py` (orchestrateur qui enchaîne vérification -> split ->
# augmentation -> slicing).
# (Anciennement "processed_dataset", renommé lors du passage à une organisation en 4 étapes
# numérotées : 1_annotated_dataset -> 2_split_dataset -> 3_augmented_dataset -> 4_sliced_dataset.)
path: E:\PixelOdyssey\3. Processed dataset\4_sliced_dataset
train: images/train
val: images/val
test : images/test

names:
  0: Mousse_Fragments_Souple
  1: Plastique_Rigide
  2: Cordage_Filet

# ============================================================================
# CLASSE "NonPlastique" RETIRÉE TEMPORAIREMENT (2026-08-19)
#
# Elle existait auparavant comme classe cible n°3, mais aucune classe brute ne
# lui était mappée dans raw_to_target : elle ne recevait donc jamais un seul
# exemple d'entraînement (0 instance dans tous les splits, ligne/colonne vide
# dans confusion_matrix.png du run pixel_odyssey_v1_nano) - un cas classique de
# classe fantôme qui gonfle artificiellement le nombre de classes déclarées
# sans jamais pouvoir être apprise. Décision : l'exclure du référentiel pour le
# moment plutôt que de la laisser trainer sans être ni comblée ni assumée.
#
# Pour la réintroduire un jour :
#   1. Décider quelles classes brutes (raw_classes) doivent y être mappées
#      dans raw_to_target ci-dessous (ex: un futur sous-type de déchet qui ne
#      rentre dans aucune des 3 super-classes actuelles).
#   2. La rajouter dans `names` (elle redeviendra l'ID le plus haut, 3).
#   3. Relancer `slice_dataset.py --force` (étape 4 seule) pour re-découper avec le
#      nouveau nombre de classes - inutile de retoucher aux étapes 2/3, elles
#      travaillent en référentiel brut raw_classes, pas en super-classes.
# ============================================================================

# ============================================================================
# RÉFÉRENTIEL UNIQUE DE CLASSES — source de vérité pour tout le projet.
#
# 
# raw_classes : taxonomie brute CVAT à 20 classes (celle utilisée par les
#   lots SL 11-16 / SL 17-25 / SL 6-10_26-27 — voir leur data.yaml local).
# excluded_raw_classes : IDs bruts toujours ignorés, quel que soit le mode
#   (remap_classes=True ou False).
# raw_to_target : table de passage raw_classes -> names (les 4 super-classes
#   ci-dessus), utilisée uniquement quand remap_classes=True.
# ============================================================================

raw_classes:
  0: bouteille PET
  1: Cordage
  2: Bouées
  3: Inconnu
  4: Fragments plastique rigide
  5: Bouées pieuvre
  6: Petit bidon
  7: Plastique souple (sac)
  8: Mousse expansée
  9: Sceau
  10: Polystyrene
  11: fliflops
  12: casques
  13: bouchons
  14: cagette
  15: Bouteille Plastique rigide
  16: Morceaux de bois
  17: Verre
  18: Tissu
  19: flotteurs
  20: A determiner

excluded_raw_classes: [3, 16, 17, 20]  # Inconnu, Bois, Verre, A determiner — jamais des déchets plastiques valides

raw_to_target:
  # -> 0: Mousse_Fragments_Souple (Films, sacs, mousses, textiles, flip-flops)
  7: 0    # Plastique souple (sac)
  8: 0    # Mousse expansée
  10: 0   # Polystyrène
  11: 0   # Fliflops (mousse EVA)
  18: 0   # Tissu

  # -> 1: Plastique_Rigide (Bouteilles, bidons, bouchons, fragments rigides, casques, cagettes)
  0: 1    # Bouteille PET
  2: 1    # Bouées
  4: 1    # Fragments plastique rigide
  5: 1    # Bouées pieuvre
  6: 1    # Petit bidon
  9: 1    # Seau
  12: 1   # Casques
  13: 1   # Bouchons
  14: 1   # Cagette
  15: 1   # Bouteille Plastique rigide
  19: 1   # Flotteurs

  # -> 2: Cordage_Filet (Fils, bout, filet de pêche)
  1: 2    # Cordage

  # (Il n'y a plus de classe cible 3 : voir le bloc "NonPlastique RETIRÉE
  # TEMPORAIREMENT" juste au-dessus de `names`.)

# ============================================================================
# SURCHARGES DE TAXONOMIE PAR LOT
#
# Découvert lors de l'audit pré-slicing (raw_dataset_checker.py) : les lots
# SB 1 à SB 5 (Saint-Brandon) ont été exportés depuis CVAT avec un schéma à
# 9 classes totalement différent de "raw_classes" ci-dessus (ex: la classe
# brute "8" veut dire "Mousse expansée" dans raw_classes, mais "inconnu" dans
# le schéma SB). Sans traduction, un run de slicing sur ces lots contaminait
# silencieusement le dataset (de l'"inconnu" se retrouvait étiqueté comme de
# la vraie "Mousse expansée", et des "casques" valides étaient jetés à tort
# comme "Inconnu").
#
# Chaque entrée ci-dessous traduit les IDs bruts d'un lot vers raw_classes
# AVANT que excluded_raw_classes / raw_to_target ne s'appliquent. Les
# fichiers .txt sources ne sont JAMAIS modifiés : la traduction se fait en
# mémoire, au moment du slicing (voir PlasticImageSlicer._load_yolo_labels).
#
# Clé = nom du sous-dossier de premier niveau sous annotated_dataset.
# Un lot absent de cette table est supposé déjà conforme à raw_classes
# (c'est le cas de tous les lots SL aujourd'hui).
# ============================================================================
batch_class_overrides:
  "SB 1": &sb_1_to_5_scheme
    0: 14  # cagette                      -> cagette (14)
    1: 11  # flipflops                    -> fliflops (11)
    2: 13  # bouchons                     -> bouchons (13)
    3: 12  # casques                      -> casques (12)
    4: 0   # bouteilles_pet               -> bouteille PET (0)
    5: 15  # bouteilles_plastique_rigide  -> Bouteille Plastique rigide (15)
    6: 1   # cordage                      -> Cordage (1)
    7: 2   # bouees                       -> Bouées (2)
    8: 3   # inconnu                      -> Inconnu (3)
  "SB 2": *sb_1_to_5_scheme
  "SB 3": *sb_1_to_5_scheme
  "SB 4": *sb_1_to_5_scheme
  "SB 5": *sb_1_to_5_scheme
